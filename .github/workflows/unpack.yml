name: unpack-site
# 连接器只能上传文本：整站打包为 tar.gz 再 base64 分片放在 _bundle/，此 workflow 校验后解包到仓库根目录并提交回 main。
# Pages 设置：Settings → Pages → Deploy from a branch → main / (root)
on:
  push:
    branches: [main]
    paths: ['_bundle/**']
  workflow_dispatch:
concurrency:
  group: unpack
  cancel-in-progress: false
jobs:
  unpack:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Unpack
        run: |
          [ -f _bundle/parts ] || { echo "no bundle"; exit 0; }
          n=$(cat _bundle/parts); have=$(ls _bundle/part* | wc -l)
          if [ "$have" -lt "$n" ]; then echo "waiting for parts ($have/$n)"; exit 0; fi
          cat $(ls _bundle/part[0-9]* | sort) | base64 -d > /tmp/site.tgz
          echo "$(cat _bundle/sha)  /tmp/site.tgz" | sha256sum -c -
          tar -xzf /tmp/site.tgz -C .
          git rm -r -q _bundle
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || { git commit -m "Unpack static site [skip ci]"; git pull --rebase -q || true; git push; }
